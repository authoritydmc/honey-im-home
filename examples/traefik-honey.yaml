# File-provider fallback if docker labels are not used.
# Copy to /data/coolify/proxy/dynamic/honey.yaml on the Traefik host.
http:
  routers:
    honey-https:
      entryPoints: [https]
      rule: "Host(`honey.rajlabs.in`)"
      middlewares: [authentik-auth@file]
      service: honey-service
      tls: { certresolver: letsencrypt }
      priority: 200
    honey-http:
      entryPoints: [http]
      rule: "Host(`honey.rajlabs.in`)"
      middlewares: [redirect-to-https@file]
      service: honey-service
      priority: 200
  services:
    honey-service:
      loadBalancer:
        servers:
          # Must match a real Docker-DNS name on the Traefik network.
          # With docker-compose.prod.yml the container alias is `honey`;
          # prefer Traefik docker labels instead of this file when possible.
          - url: "http://honey:8078"
