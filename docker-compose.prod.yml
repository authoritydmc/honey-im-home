services:
  honey:
    build: .
    image: ghcr.io/authoritydmc/honey-im-home:latest
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 128m
    # PROD: honeypot reached via NAT DNAT from public :22 straight to its
    # stable container IP (preserves attacker source IP; userland-proxy would mask it).
    # Host sshd + ssh.socket are NEVER touched. API on localhost only.
    ports:
      - "2222:2222"       # direct :2222 also trap (source shown as gateway; use :22 for real intel)
      - "127.0.0.1:8078:8078"  # API/UI localhost only, Traefik fronts it
    env_file: .env
    environment:
      DATA_DIR: /srv/data
      HONEYPOT_HOST: 0.0.0.0
      HONEYPOT_PORT: 2222
      API_PORT: 8078
      TRUST_PROXY_AUTH: 1
      SSO_ONLY: 1
      AUTH_URL: https://auth.rajlabs.in
      # Storage bounds: 2-day retention, 10GB max, jsonl rotation 100MB x3.
      RETENTION_DAYS: ${RETENTION_DAYS:-2}
      MAX_DB_GB: ${MAX_DB_GB:-10}
      JSONL_MAX_MB: ${JSONL_MAX_MB:-100}
      # Optional Postgres (shared dev-postgres): set DATABASE_URL to switch
      # off sqlite. Honey gets its own DB via init script (see server-setups).
      # DATABASE_URL: postgresql://honey:***@dev-postgres:5432/honey
    volumes:
      - honey_data:/srv/data
    networks:
      coolify:
        ipv4_address: ${HONEY_IPV4:-10.0.2.50}
        ipv6_address: ${HONEY_IPV6:-fdc9:f46e:be08::50}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: false  # sqlite needs writes in /srv/data (volume)
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.honey-https.rule=Host(`honey.rajlabs.in`)"
      - "traefik.http.routers.honey-https.entrypoints=https"
      - "traefik.http.routers.honey-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.honey-https.middlewares=authentik-auth@file"
      - "traefik.http.routers.honey-http.rule=Host(`honey.rajlabs.in`)"
      - "traefik.http.routers.honey-http.entrypoints=http"
      - "traefik.http.routers.honey-http.middlewares=redirect-to-https@file"
      - "traefik.http.services.honey.loadbalancer.server.port=8078"
networks:
  coolify:
    external: true
volumes:
  honey_data:
