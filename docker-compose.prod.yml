services:
  honey:
    build: .
    image: ghcr.io/authoritydmc/honey-im-home:latest
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 128m
    # PROD: honeypot on host :2222 (reached via NAT REDIRECT from :22).
    # Host sshd + ssh.socket are NEVER touched. API on localhost only.
    ports:
      - "2222:2222"       # trap (public :22 DNATs here; direct :2222 also trap)
      - "127.0.0.1:8078:8078"  # API/UI localhost only, Traefik fronts it
    env_file: .env
    environment:
      DATA_DIR: /srv/data
      HONEYPOT_HOST: 0.0.0.0
      HONEYPOT_PORT: 2222
      API_PORT: 8078
      TRUST_PROXY_AUTH: 1
    volumes:
      - honey_data:/srv/data
    networks:
      - coolify
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: false  # sqlite needs writes in /srv/data (volume)
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.honey-https.rule=Host(`honey.rajlabs.in`)"
      - "traefik.http.routers.honey-https.entrypoints=https"
      - "traefik.http.routers.honey-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.honey-https.middlewares=authentik-auth@file"
      - "traefik.http.routers.honey-http.rule=Host(`honey.rajlabs.in`)"
      - "traefik.http.routers.honey-http.entrypoints=http"
      - "traefik.http.routers.honey-http.middlewares=redirect-to-https@file"
      - "traefik.http.services.honey.loadbalancer.server.port=8078"
networks:
  coolify:
    external: true
volumes:
  honey_data:
